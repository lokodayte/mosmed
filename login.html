<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOSMED — Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-cream);
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg) var(--container-pad);
    }

    .login-card {
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 40px var(--color-shadow-md);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
    }

    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .login-logo img {
      height: 56px;
      width: auto;
    }

    .login-heading {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 600;
      color: var(--color-slate);
      text-align: center;
      margin-bottom: 0.35rem;
      letter-spacing: -0.02em;
    }

    .login-subheading {
      font-size: 0.88rem;
      color: var(--color-slate-light);
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-slate-mid);
      margin-bottom: 0.4rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-body);
      background: var(--color-cream);
      transition: border-color var(--ease), box-shadow var(--ease);
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--color-amber);
      box-shadow: 0 0 0 3px rgba(229, 154, 60, 0.15);
      background: var(--color-white);
    }

    .login-btn {
      width: 100%;
      padding: 0.85rem 1rem;
      margin-top: 0.5rem;
      background: var(--color-amber);
      color: var(--color-white);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background var(--ease), transform 80ms ease;
    }

    .login-btn:hover  { background: var(--color-amber-dark); }
    .login-btn:active { transform: scale(0.98); }

    .login-divider {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 1.75rem 0 1.25rem;
    }

    .login-back {
      display: block;
      text-align: center;
      font-size: 0.85rem;
      color: var(--color-slate-light);
      transition: color var(--ease);
    }

    .login-back:hover { color: var(--color-amber); }

    .login-notice {
      margin-top: 1.5rem;
      padding: 0.65rem 0.9rem;
      background: rgba(229,154,60,0.08);
      border-left: 3px solid var(--color-amber);
      border-radius: 4px;
      font-size: 0.78rem;
      color: var(--color-slate-mid);
      line-height: 1.5;
    }

    /* ── minimal header for login page ── */
    .login-header {
      background: var(--color-white);
      border-bottom: 1px solid var(--color-border);
      height: 72px;
      display: flex;
      align-items: center;
    }

    .login-header .container {
      display: flex;
      align-items: center;
    }

    .login-header .nav-logo img {
      height: 44px;
      width: auto;
    }
  </style>
</head>
<body>

  <header class="login-header">
    <div class="container">
      <a href="index.html" class="nav-logo" aria-label="MOSMED — home">
        <img
          src="assets/images/edited-logo-removebg-preview.png"
          alt="MOSMED logo"
        />
      </a>
    </div>
  </header>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo">
        <img src="assets/images/logowithouttext.png" alt="MOSMED" />
      </div>

      <h1 class="login-heading">Welcome back</h1>
      <p class="login-subheading">Sign in to your MOSMED account</p>

      <!-- POST over plain HTTP — credentials appear in plaintext in Wireshark -->
      <form method="POST" action="/login" autocomplete="off">

        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="your.name@mosmed.am"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="login-btn">Sign in</button>

      </form>

      <div class="login-notice">
        This portal is for authorised MOSMED personnel only.
        Unauthorised access attempts are logged.
      </div>

      <hr class="login-divider" />
      <a href="index.html" class="login-back">← Back to mosmed.am</a>

    </div>
  </div>

</body>
</html>
